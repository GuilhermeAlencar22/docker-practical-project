version: "3.9"

services:
  web:
    build: ./app
    container_name: web_app
    ports:
      - "8081:5000"
    environment:
      - DATABASE_HOST=db
      - DATABASE_USER=admin
      - DATABASE_PASSWORD=1234
      - DATABASE_NAME=empresa
      - CACHE_HOST=cache
    depends_on:
      - db
      - cache
    networks:
      - backend

  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: empresa
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

  cache:
    image: redis:alpine
    container_name: redis_cache
    restart: always
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
    driver: bridge
